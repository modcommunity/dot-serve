// dotserve — server configuration
//
// This file is read by dot-server's console at boot, one command per line, exactly
// as if it had been typed. Anything valid at the console is valid here.
//
// It was generated on first run and dotserve will never overwrite it. Delete it to
// get a fresh one with current comments.

// ---------------------------------------------------------------------------
// Identity
// ---------------------------------------------------------------------------

// What players see in a server browser.
hostname "@HOSTNAME@"

// Free-form. Shown in listings that support it.
sv_tags "@TAGS@"

// ---------------------------------------------------------------------------
// Access
// ---------------------------------------------------------------------------

// Empty means anyone may join. Set it and clients must supply it.
sv_password ""

// Players allowed at once. Bandwidth, not CPU, is usually the limit.
maxplayers @MAXPLAYERS@

// ---------------------------------------------------------------------------
// Remote administration
// ---------------------------------------------------------------------------

// RCON lets an operator run console commands over the network.
//
// An empty password means the RCON listener does not open at all, which is the
// right setting for a server nobody administers remotely. dotserve generated the
// one below; it was printed once, when this file was created.
//
// Change it here if you like. Do NOT put it in a command line or an environment
// variable: both are readable by any other process on the machine and both end up
// in pasted bug reports.
rcon_password "@RCON_PASSWORD@"

// ---------------------------------------------------------------------------
// Simulation
// ---------------------------------------------------------------------------

// Simulation rate. Higher is more responsive and costs bandwidth and CPU on every
// client as well as here.
sv_tickrate @TICKRATE@

// Seconds before a silent client is dropped.
sv_timeout 30

// How long to hold the slot of a player whose browser tab went into the background.
//
// A browser stops driving the game's main loop for a hidden tab, so a player who
// switches tabs goes silent in a way that is indistinguishable from a machine that
// died -- and sv_timeout drops them. A client announces the switch before it goes
// quiet; this is the budget it gets. 0 refuses it. Minutes, not tens of minutes:
// the server keeps sending to a client that is not reading.
sv_background_grace 300

// Whether cheat-flagged commands are permitted. Off on anything public.
sv_cheats 0

// ---------------------------------------------------------------------------
// Content
// ---------------------------------------------------------------------------

// The game to load at boot. Empty starts a lobby with no game, which is a
// legitimate thing to run.
// sv_game "res://games/arena"

// ---------------------------------------------------------------------------
// Anything else
// ---------------------------------------------------------------------------

// Commands in autoexec.cfg run after this file, so put local overrides there and
// leave this one close to the shipped default. It survives an upgrade; this may
// not.
